<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Produtos</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.6rem; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 18px; padding: 10px 18px; cursor: pointer; }
    #mensagem { margin-top: 16px; font-weight: bold; }
    .ok { color: #1b7f3b; }
    .erro { color: #b00020; }
    a { display: inline-block; margin-top: 24px; }
  </style>
  <script src="config.js"></script>
</head>
<body>
  <h1>Cadastro de Produtos</h1>

  <form id="form-produto">
    <label for="nome">Nome do produto</label>
    <input id="nome" name="nome" type="text" maxlength="150" required>

    <label for="categoria">Categoria</label>
    <input id="categoria" name="categoria" type="text" maxlength="100" required>

    <label for="preco">Preço (R$)</label>
    <input id="preco" name="preco" type="number" step="0.01" min="0" required>

    <label for="quantidade">Quantidade em estoque</label>
    <input id="quantidade" name="quantidade" type="number" step="1" min="0" required>

    <button type="submit">Cadastrar</button>
  </form>

  <p id="mensagem"></p>

  <a href="listar.html">Listar todos os produtos</a>

  <script>
    const form = document.getElementById("form-produto");
    const mensagem = document.getElementById("mensagem");

    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();

      const produto = {
        nome: document.getElementById("nome").value.trim(),
        categoria: document.getElementById("categoria").value.trim(),
        preco: parseFloat(document.getElementById("preco").value),
        quantidade: parseInt(document.getElementById("quantidade").value, 10),
      };

      try {
        // Requisição HTTP para a API da VM2
        const resposta = await fetch(`${window.API_URL}/produto`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(produto),
        });
        const dados = await resposta.json();
        if (!resposta.ok) {
          throw new Error(dados.erro || `HTTP ${resposta.status}`);
        }
        mensagem.textContent = `Produto cadastrado com o id ${dados.id}.`;
        mensagem.className = "ok";
        form.reset();
      } catch (erro) {
        mensagem.textContent = `Erro ao cadastrar: ${erro.message}`;
        mensagem.className = "erro";
      }
    });
  </script>
</body>
</html>
